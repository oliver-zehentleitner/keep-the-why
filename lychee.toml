# Config for the Link Check workflow (lychee auto-loads ./lychee.toml).
#
# Eval fixtures are excluded: they are scenario *data* for tools/evals/run.py,
# not documentation. Their internal links (e.g. context/index.md ->
# architecture.md) resolve only after the runner overlays the shared _base
# fixture at runtime, so checking them as repo files produces false positives.
# experiments/*/results are per-session transcripts and diffs — data behind an
# article, not documentation; URLs in them are whatever the agent printed.
# dashboard/ktw_dashboard/web/ is the dashboard's page, served by its own
# server (root-relative /static/... links resolve there, not in the repo).
# docs/evals/runs/ are the runner's per-run summaries, published as written:
# a URL in them is whatever the judge quoted, often cut off mid-way by the
# runner's column limit.
exclude_path = ["tools/evals/fixtures", "experiments/rejected-change/results", "dashboard/ktw_dashboard/web", "docs/evals/runs"]

# mcpmarket.com rate-limits lychee's request bursts with 429s (seen repeatedly
# on the "Also listed on" link across README.md/llms.txt/docs/installation.md,
# unrelated to the link's actual validity) - skip it rather than have Link
# Check flake red on every push that touches any of those files.
# x.com answers lychee with 403 Forbidden for the profile link behind the X badge
# (README.md, lint/README.md) — bot-blocking on their side, not a dead link;
# opening it in a browser works. Same treatment as mcpmarket.com.
# keepthewhy.com/dashboard/ (the docs page) and /dashboard/live/ (written into
# site/ at deploy time by ktw-dashboard --export) exist on the live site only
# after the deploy that carries them; the tree/main/dashboard link on GitHub
# only after the merge. Same shape as the CHANGELOG compare-link case.
# deepwiki.com answers the runners with 429 Too Many Requests and
# hol.org/registry times out on them (both since 2026-09-29, red on every push
# and PR); both open fine in a browser and hol.org is known to be flaky —
# rate limiting and slow hosts on their side, not dead links.
# www.npmjs.com answers non-browser clients with 403 (bot protection); the
# package page exists, `npm view keep-the-why` is the check that works.
exclude = [
  "^https://www\\.npmjs\\.com/",
  "^https://deepwiki\\.com/",
  "^https://hol\\.org/",
  "^https://mcpmarket\\.com/",
  "^https://x\\.com/",
  "^https://keepthewhy\\.com/dashboard/",
  "^https://github\\.com/oliver-zehentleitner/keep-the-why/tree/main/dashboard",
]
