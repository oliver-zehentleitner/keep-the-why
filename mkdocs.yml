site_name: Keep the Why
site_description: Keep the Why is a repo-native convention and agent skill that preserves the reasoning behind a codebase as a byproduct of working with your agent — so it stops re-suggesting rejected approaches, gives better answers, speeds up onboarding, and makes legacy projects tractable again.
site_url: https://keepthewhy.com
repo_url: https://github.com/oliver-zehentleitner/keep-the-why
repo_name: oliver-zehentleitner/keep-the-why

theme:
  name: material
  custom_dir: overrides
  logo: assets/wordmark-transparent.png
  favicon: assets/icon-transparent.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - include-markdown

markdown_extensions:
  - md_in_html
  - pymdownx.superfences

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/keep_the_why
      name: Keep the Why on X
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/keep-the-why.bsky.social
      name: Keep the Why on Bluesky
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@keep_the_why
      name: Keep the Why on Mastodon

nav:
  - Overview: index.md
  - Philosophy: philosophy.md
  - Installation: installation.md
  - Repository structure: repository-structure.md
  - Security: security.md
  - Evals: evals.md
  - Agent & model matrix: agent-matrix.md
  - Badge: badge.md
  - FAQ: faq.md
  - Why I built this: why.md
  - Reference:
      - Setup: setup.md
      - Migrations: migrations.md
      - Methodology: methodology.md
      - Continuous capture: continuous-capture.md
      - Retrospective analysis: retrospective-analysis.md
      - Interview playbook: interview-playbook.md
      - Trust model: trust-model.md
  - Examples:
      - First-time setup: examples/first-time-setup.md
      - Continuous development: examples/continuous-development.md
      - Abandoned change: examples/abandoned-change.md
      - Legacy project: examples/legacy-project.md
      - Developer handover: examples/developer-handover.md
  - "Why this project is built this way":
      - Release and distribution: context/release-and-distribution.md
      - Skill configuration format: context/config-format.md
      - Entry and layout format: context/entry-format.md
      - Positioning: context/positioning.md
      - Compatibility: context/compatibility.md
