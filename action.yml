name: "Keep the Why Lint"
description: >-
  Structural linter for Keep the Why projects: validates .keep-the-why and
  context/ (fields, values, index, hidden content).
author: "Oliver Zehentleitner"
branding:
  icon: "check-square"
  color: "purple"

inputs:
  path:
    description: "Project root to lint"
    required: false
    default: "."
  strict:
    description: "Treat warnings as errors (true/false)"
    required: false
    default: "false"
  version:
    description: >-
      keep-the-why-lint version to install. Empty (the default) installs the
      version this checkout of the action belongs to — so @lint-latest, which
      moves with every linter release, installs the newest, and @lint-v<version>
      or @<sha> pins action and linter together, as pinning an action usually
      means. "latest" always installs PyPI's newest regardless of the ref.
    required: false
    default: ""
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install keep-the-why-lint
      shell: bash
      env:
        KTW_LINT_VERSION: ${{ inputs.version }}
        KTW_ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "$KTW_LINT_VERSION" ]; then
          # No version given: the one this checkout of the action belongs to.
          # lint-latest is moved to the lint-v<version> tag after each
          # publish, so on that ref this is PyPI's newest; on a pinned ref it
          # is the linter that ref was released with.
          KTW_LINT_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$KTW_ACTION_PATH/lint/ktw_lint/__init__.py")
          if [ -z "$KTW_LINT_VERSION" ]; then
            echo "::error::could not read the linter version from the action checkout"
            exit 1
          fi
        fi
        if [ "$KTW_LINT_VERSION" = "latest" ]; then
          python -m pip install --quiet --upgrade keep-the-why-lint
        else
          for attempt in 1 2 3; do
            if python -m pip install --quiet "keep-the-why-lint==$KTW_LINT_VERSION"; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::keep-the-why-lint $KTW_LINT_VERSION is not installable from PyPI"
              exit 1
            fi
            sleep 20  # a release published moments ago can take a little while to reach every mirror
          done
        fi

    - name: Run ktw-lint
      shell: bash
      env:
        KTW_LINT_PATH: ${{ inputs.path }}
        KTW_LINT_STRICT: ${{ inputs.strict }}
      run: |
        ARGS=""
        if [ "$KTW_LINT_STRICT" = "true" ]; then ARGS="--strict"; fi
        ktw-lint "$KTW_LINT_PATH" $ARGS
