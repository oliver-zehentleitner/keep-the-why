name: Build and Publish keep-the-why-dashboard (PyPI)

# Manual trigger only. Builds the dashboard package from dashboard/,
# publishes it to PyPI via trusted publishing (environment "pypi"), and —
# only after the upload succeeded — pushes an annotated tag
# dashboard-v<version> so every PyPI release points at exactly one commit.
# Same shape as publish-lint.yml; the dashboard has its own version counter.
#
# No GitHub Release is created here: the releases page stays skill-only.
# The dashboard-v* tag pattern deliberately doesn't match release.yml's v*.*.*.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        working-directory: dashboard
        run: |
          V=$(python -c "import ktw_dashboard; print(ktw_dashboard.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "keep-the-why-dashboard $V"

      - name: Refuse to publish a version that is already tagged
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/dashboard-v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag dashboard-v$VERSION already exists — bump dashboard/ktw_dashboard/__init__.py first"
            exit 1
          fi

      - name: Run test suite
        run: |
          python -m pip install --quiet ./lint
          cd dashboard && python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        working-directory: dashboard
        run: |
          python -m pip install --quiet build
          python -m build
          ls -l dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dashboard/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # The tags go out in a job of their own, on a fresh runner. The runner
  # receives every secret a job references when the job starts, so the
  # release-tags App's key must not be referenced in the upload job at
  # all — not even in a step after the upload — or it would be in memory
  # while the third-party PyPI action runs. The key lives only in the
  # `release` environment; tags under the release-tags ruleset can be
  # pushed by the repository admin and that App, never by GITHUB_TOKEN.
  # See context/release-and-distribution.md.
  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Mint the release-tags token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          # a tag on a commit whose workflow files differ from the default branch's (main moved on with a
          # workflow change while the run was waiting) counts as a workflow change to GitHub: without this
          # the push is refused with GH013. See context/release-and-distribution.md.
          permission-workflows: write

      # The commit `build` built from and `publish` uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag the published commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="dashboard-v$VERSION"
          # A re-run of this job (the release checklist's first remedy)
          # may find the tag already pushed by an earlier attempt. On this
          # run's commit it is kept and not pushed again; on any other
          # commit the run fails — a release tag is never moved.
          REMOTE=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}") || {
            echo "::error::cannot list the tags on origin"
            exit 1
          }
          if [ -n "$REMOTE" ]; then
            AT=$(awk -v r="refs/tags/$TAG^{}" '$2 == r { print $1 }' <<<"$REMOTE")
            [ -n "$AT" ] || AT=$(awk -v r="refs/tags/$TAG" '$2 == r { print $1 }' <<<"$REMOTE")
            if [ "$AT" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on $AT, not on this run's commit $GITHUB_SHA — not moved"
              exit 1
            fi
            echo "::notice::$TAG already points at $GITHUB_SHA (an earlier attempt of this run); kept, not pushed again"
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            exit 0
          fi
          # The tagger is the App's bot user, the account that pushes the
          # tag. No fallback identity: a failed lookup fails the run.
          BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id) || {
            echo "::error::cannot resolve the bot user of App '${APP_SLUG}'"
            exit 1
          }
          if ! [[ "$BOT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::bot user id of '${APP_SLUG}' is '${BOT_ID}', not a number"
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git tag "$TAG" -m "keep-the-why-dashboard $VERSION (PyPI)"
          git push origin "$TAG"
