name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "skills/keep-the-why/**"
      - "context/**"
      - "docs/**"
      - "dashboard/**"
      - "lint/**"
      - "llms.txt"
      - "mkdocs.yml"
      - "tools/mkdocs/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "registry/**"
      - "tools/registry/**"
  schedule:
    - cron: "17 5 * * 1" # the registry index is rebuilt weekly with the site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the live dashboard dates entries by Git history; depth 1 dates all of them today
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: cp llms.txt docs/llms.txt
      # The registry index (keepthewhy.com/registry/index.json) is built here, not committed:
      # the previous index - for the 30-day grace of an export that stops answering - is the
      # published one, and a line that cannot be listed is left out with a warning.
      - run: python3 tools/registry/build.py --publish --previous https://keepthewhy.com/registry/index.json
      - run: mkdocs build --strict
      # The live example on /dashboard/live/: this repository's own context/,
      # exported by the dashboard in this checkout (the reason lint/ and
      # dashboard/ are in the paths above). Not a docs page; copied into site/.
      - run: |
          pip install --quiet ./lint ./dashboard
          ktw-dashboard --export site/dashboard/live .
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
