name: Black

on:
  push:
    branches: [main]
  pull_request:

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install black
        run: pip install black==26.5.1

      # Eval fixtures are materialized sample projects, not this repo's code —
      # their formatting is part of the scenario, so they stay as written.
      - name: Check formatting
        run: black --check --diff --extend-exclude 'tools/evals/fixtures' .
