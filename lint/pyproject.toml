[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-the-why-lint"
description = "Structural linter for Keep the Why projects, in CI and locally: validates .keep-the-why and context/ entry structure, schema-version-aware."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oliver Zehentleitner" }]
requires-python = ">=3.10"
dynamic = ["version"]
keywords = [
    "keep-the-why",
    "linter",
    "lint",
    "ci",
    "documentation",
    "decision-records",
    "adr",
    "architecture-decision-records",
    "rationale",
    "context-engineering",
    "agent-skills",
    "ai-agents",
    "markdown",
    "github-actions",
    "pre-commit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://keepthewhy.com"
Documentation = "https://keepthewhy.com/linting/"
"CI setup" = "https://keepthewhy.com/ci-linting/"
"Finding codes" = "https://keepthewhy.com/linting/#finding-codes"
Repository = "https://github.com/oliver-zehentleitner/keep-the-why"
Source = "https://github.com/oliver-zehentleitner/keep-the-why/tree/main/lint"
Changelog = "https://github.com/oliver-zehentleitner/keep-the-why/blob/main/CHANGELOG.md"
Issues = "https://github.com/oliver-zehentleitner/keep-the-why/issues"
Security = "https://github.com/oliver-zehentleitner/keep-the-why/blob/main/SECURITY.md"
"Skill (Keep the Why)" = "https://keepthewhy.com/installation/"
"llms.txt" = "https://keepthewhy.com/llms.txt"
Telegram = "https://t.me/unicorndevs"
X = "https://x.com/keep_the_why"
Bluesky = "https://bsky.app/profile/keep-the-why.bsky.social"
Mastodon = "https://mastodon.social/@keep_the_why"

[project.scripts]
ktw-lint = "ktw_lint.cli:main"

[tool.setuptools]
packages = ["ktw_lint"]

[tool.setuptools.dynamic]
version = { attr = "ktw_lint.__version__" }
