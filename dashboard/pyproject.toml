[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-the-why-dashboard"
description = "Read-only live dashboard over a Keep the Why project: the entries in context/, their Git history and authors, the linter's findings — served locally or exported as one static page."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oliver Zehentleitner" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["keep-the-why-lint>=0.16.1.0"]
keywords = [
    "keep-the-why",
    "dashboard",
    "visualization",
    "decision-records",
    "adr",
    "rationale",
    "context-engineering",
    "agent-skills",
    "ai-agents",
    "markdown",
    "git",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://keepthewhy.com/dashboard/"
Repository = "https://github.com/oliver-zehentleitner/keep-the-why"
Issues = "https://github.com/oliver-zehentleitner/keep-the-why/issues"

[project.scripts]
ktw-dashboard = "ktw_dashboard.cli:main"

[tool.setuptools]
packages = ["ktw_dashboard"]

[tool.setuptools.package-data]
ktw_dashboard = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "ktw_dashboard.__version__" }
