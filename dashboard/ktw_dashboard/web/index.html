<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep the Why — dashboard</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/style.css">
<noscript><style>#app { display: none; }</style></noscript>
</head>
<body>
<noscript>
<div class="nojs">
  <a class="nojs-brand" href="https://keepthewhy.com"><img src="/static/wordmark.png" alt="Keep the Why" height="29"></a>
  <p class="nojs-need">This dashboard needs JavaScript for its graph, search, timeline and the projects it links to. What it shows is plain Markdown in the repository's <code>context/</code>, readable without it.</p>
  <!--ktw:noscript-->
  <section class="nojs-about">
    <h2>About Keep the Why</h2>
    <p>Keep the Why records the reasoning code cannot explain — decisions, the alternatives that lost, workarounds, constraints — as plain Markdown in the repository, next to the code and versioned with it. A coding agent writes it as the reasons come up and any agent or person reads it back, so a settled question is not reopened and an abandoned change is not tried again.</p>
    <p><a href="https://keepthewhy.com">keepthewhy.com</a> · <a href="https://keepthewhy.com/installation/">Install</a> · <a href="https://keepthewhy.com/dashboard/">The dashboard</a> · <a href="https://github.com/oliver-zehentleitner/keep-the-why">GitHub</a></p>
  </section>
</div>
</noscript>
<div id="app" class="app">
  <header class="topbar">
    <a class="brand" href="#overview" title="Overview">
      <img src="/static/wordmark.png" alt="Keep the Why" height="29" class="wordmark">
    </a>
    <select id="project-select" class="project-select" hidden title="Project"></select>
    <div id="mode" class="mode" hidden title="Local reads clones and caches on this machine; public reads the family's published exports"><button type="button" data-mode="local">local</button><button type="button" data-mode="public">public</button><span id="mode-note" class="note"></span></div>
    <div id="scope" class="mode" hidden title="What every view shows: this project, or the whole family tree merged"><button type="button" data-scope="project">this project</button><button type="button" data-scope="family">family</button></div>
    <div class="project" id="project-title"></div>
    <div class="topbar-right">
      <input id="search" type="search" placeholder="Search entries…  ( / )" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results" hidden></div>
      <span id="live" class="live" title="">●</span>
      <button id="theme" class="icon-btn" title="Toggle theme">◐</button>
      <span id="badges" class="icon-btn badges-btn" tabindex="0" title="">⚙<div class="badges-pop" id="badges-pop"></div></span>
    </div>
  </header>
  <div class="strip" id="strip"></div>
  <nav class="sidebar" id="sidebar">
    <div class="nav">
      <a href="#overview" data-route="overview">Overview</a>
      <a href="#graph" data-route="graph">Graph</a>
      <a href="#queues" data-route="queues">Queues <span id="queue-count" class="count"></span></a>
      <a href="#family" data-route="family">Family</a>
      <a href="#friends" data-route="friends">Friends</a>
      <a href="#thoughts" data-route="thoughts">Thoughts</a>
      <a href="#timeline" data-route="timeline">Timeline</a>
      <a href="#authors" data-route="authors">Authors</a>
      <a href="#projects" data-route="projects" id="nav-projects" hidden>Projects</a>
      <button id="side-toggle" class="nav-toggle" type="button" aria-expanded="false">Topics ▾</button>
    </div>
    <div class="filters" id="filters">
      <select id="f-status"><option value="">status: all</option></select>
      <select id="f-evidence"><option value="">evidence: all</option></select>
      <select id="f-author"><option value="">author: all</option></select>
      <button id="f-clear" class="link-btn" hidden>clear</button>
    </div>
    <div class="tree-head">Topics <span id="tree-count" class="count"></span></div>
    <div class="tree" id="tree"></div>
  </nav>
  <main class="main" id="main"></main>
  <aside class="details" id="details"></aside>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
